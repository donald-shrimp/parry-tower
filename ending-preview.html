<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>パリィの塔 · エンディング確認</title><link rel="stylesheet" href="./assets/style.css?v=v0.9.5-preview-3"><link rel="stylesheet" href="./assets/ending-preview.css?v=v0.9.5-preview-3"></head><body>
<main class="ending-review"><header><h1>エンディング確認</h1><p>演出のたたき台。本編の進行・報酬・セーブには影響しません。</p><a href="./index.html?v=v0.9.5-preview-3">本編へ</a> · <a href="./dev.html?v=v0.9.5-preview-3">Devへ</a></header>
<canvas id="endingCanvas" width="960" height="600" aria-label="花火で塔が爆発するエンディングの確認画面"></canvas>
<section class="ending-controls" aria-label="演出の再生"><button type="button" class="primary" id="endingPlay">再生</button><button type="button" class="secondary" id="endingRestart">最初から</button><label>速度<select id="endingSpeed"><option value=".25">0.25倍</option><option value=".5">0.5倍</option><option value="1" selected>1倍</option><option value="2">2倍</option></select></label><label>主人公<select id="endingSkin"><option value="normal">いつもの主人公</option><option value="chick">ひよこちゃん</option><option value="fundoshi">赤ふんどし</option><option value="spacetime">時空</option></select></label><label><input id="endingLowFlash" type="checkbox" checked>光を控えめに</label></section>
<label class="ending-seek">場面 <output id="endingPosition">0.0秒</output><input id="endingTime" type="range" min="0" max="290" step="1" value="0"></label><nav id="endingMarks" aria-label="場面へ移動"></nav>
<section class="ending-tweaks" aria-label="演出を調整"><label>花火の尺 <output id="fireworksValue"></output><input data-param="fireworks" type="range" min="2" max="20" value="6"></label><label>引きの尺 <output id="pullbackValue"></output><input data-param="pullback" type="range" min="2" max="12" value="6"></label><label>爆発前の溜め <output id="overloadValue"></output><input data-param="overload" type="range" min="1" max="10" value="4"></label><label>花火の量 <output id="densityValue"></output><input data-param="density" type="range" min=".2" max="2" step=".1" value="1"></label><label>引いた後の倍率 <output id="zoomValue"></output><input data-param="zoom" type="range" min=".4" max=".9" step=".02" value=".58"></label><label>爆発の勢い <output id="blastValue"></output><input data-param="blast" type="range" min=".3" max="1.5" step=".1" value="1"></label></section>
<p id="endingLoad" role="status">立ち絵を準備しています…</p><p class="smallnote">時間バーで止めて、場面のボタンで見比べられます。ここで変えた数値は本編には採用されません。</p><details><summary>調整した数値</summary><pre id="endingParameters"></pre></details></main>
<script src="./assets/character-art-defaults.js?v=v0.9.5-preview-3" defer></script><script src="./assets/character-edit.js?v=v0.9.5-preview-3" defer></script><script src="./assets/palette-candidates.js?v=v0.9.5-preview-3" defer></script><script src="./assets/character-style.js?v=v0.9.5-preview-3" defer></script><script src="./assets/character-hero-puppet.js?v=v0.9.5-preview-3" defer></script><script src="./assets/ending-scene.js?v=v0.9.5-preview-3" defer></script><script src="./assets/ending-preview.js?v=v0.9.5-preview-3" defer></script></body></html>
