<!doctype html>
<html lang="ja">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <title>B表の文言エディタ · パリィの塔</title>
 <link rel="stylesheet" href="./assets/style.css">
 <link rel="stylesheet" href="./assets/copy-editor.css">
 <script src="./assets/copy-editor-model.js" defer></script>
 <script src="./assets/copy-editor.js" defer></script>
</head>
<body class="copy-editor">
 <header class="editor-header">
  <div><p class="eyebrow">PARRY TOWER · COPY EDITOR</p><h1>B表の文言エディタ</h1><p>文言を編集すると右の見本に反映します。非表示にしても入力内容は残ります。</p></div>
  <div class="editor-tools"><button id="saveProject" class="primary">保存</button><button id="exportProject">JSONを書き出す</button>
   <label class="file-button">JSONを読み込む<input type="file" id="importProject" accept=".json,application/json"></label>
  </div>
 </header>
 <p id="editorStatus" role="status" class="editor-status">読み込み中…</p>
 <main class="editor-layout">
  <nav id="entryList" aria-label="B表の編集項目"></nav>
  <section class="editor-panel" aria-labelledby="entryTitle">
   <div class="editor-panel-top"><h2 id="entryTitle"></h2><button id="resetEntry">この項目を元に戻す</button></div>
   <div id="fieldEditors"></div>
   <p id="variableHelp" class="editor-help"></p>
   <details><summary>数値の見本</summary><div id="sampleEditors"></div></details>
   <p class="editor-help">自動下書きはこのブラウザーに保存します。「保存」はローカルの編集ファイルにも保存します。ゲームへの採用は編集が終わってから行います。</p>
  </section>
  <section class="preview-panel" aria-label="表示の見本">
   <h2>編集後の見本</h2><div class="copy-preview" id="editedPreview"></div>
   <details class="original-preview" open><summary>変更前</summary><div class="copy-preview" id="originalPreview"></div></details>
  </section>
 </main>
</body>
</html>
