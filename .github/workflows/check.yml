name: Static checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JS syntax
        run: |
          node --check assets/diagnostics.js
          node --check assets/routes.js
          node --check assets/events.js
          node --check assets/relics.js
          node --check assets/progression.js
          node --check assets/game.js
      - name: Check dedicated enemies and developer launcher syntax
        run: |
          node --check assets/enemy-motions.js
          node --check assets/dev-tools.js
          node --test tests/enemy-motions.test.js
      - name: Check encounter data and gameplay invariants
        run: |
          node --check assets/encounters.js
          node --test tests/final-stage.test.js tests/deep-zones.test.js tests/diagnostics.test.js tests/encounters.test.js tests/progression.test.js tests/relics.test.js tests/routes.test.js tests/events.test.js tests/game-smoke.test.js
      - name: Check font license credit and display asset
        run: node --test tests/font-credits.test.js
      - name: Check Pages entry and asset links
        shell: python
        run: |
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          build = 'v0.9.1-2'
          paths = [
              'style.css', 'diagnostics.js', 'encounters.js', 'enemy-motions.js',
              'progression.js', 'relics.js', 'routes.js', 'events.js', 'game.js'
          ]
          for page in ['index.html', 'dev.html']:
              text = Path(page).read_text(encoding='utf-8')
              assert f'<meta name="parry-build" content="{build}">' in text
              for asset in paths:
                  assert f'./assets/{asset}?v={build}' in text, (page, asset)
                  assert Path('assets', asset).is_file()
              assert text.index('assets/diagnostics.js') < text.index('assets/game.js')
          assert 'dev.html' not in html
          dev = Path('dev.html').read_text(encoding='utf-8')
          assert 'data-parry-dev="true"' in dev
          assert f'./assets/dev-tools.js?v={build}' in dev
          assert f'./assets/dev-tools.css?v={build}' in dev
          assert Path('assets/dev-tools.js').is_file()
          assert Path('assets/dev-tools.css').is_file()
          print('Static Pages layout OK')
