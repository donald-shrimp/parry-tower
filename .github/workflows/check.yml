name: Static checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JS syntax
        run: node --check assets/game.js
      - name: Check dedicated enemies and developer launcher syntax
        run: |
          node --check assets/enemy-motions.js
          node --check assets/dev-tools.js
          node --test tests/enemy-motions.test.js
      - name: Check encounter data and gameplay invariants
        run: |
          node --check assets/encounters.js
          node --test tests/encounters.test.js tests/game-smoke.test.js
      - name: Check Pages entry and asset links
        shell: python
        run: |
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          assert 'href="./assets/style.css"' in html
          assert 'src="./assets/game.js"' in html
          assert 'src="./assets/encounters.js"' in html
          assert Path('assets/encounters.js').is_file()
          assert Path('assets/style.css').is_file()
          assert Path('assets/game.js').is_file()
          assert Path('assets/enemy-motions.js').is_file()
          assert 'src="./assets/enemy-motions.js"' in html
          assert 'dev.html' not in html
          dev = Path('dev.html').read_text(encoding='utf-8')
          assert 'data-parry-dev="true"' in dev
          assert 'src="./assets/dev-tools.js"' in dev
          assert Path('assets/dev-tools.js').is_file()
          assert Path('assets/dev-tools.css').is_file()
          print('Static Pages layout OK')
