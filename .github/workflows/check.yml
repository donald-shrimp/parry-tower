name: Static checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JS syntax
        run: |
          node --check assets/diagnostics.js
          node --check assets/routes.js
          node --check assets/events.js
          node --check assets/relics.js
          node --check assets/progression.js
          node --check assets/game.js
          node --check assets/character-art.js
          node --check assets/character-svg.js
          node --check assets/character-flat.js
          node --check assets/character-trace.js
          node --check assets/character-ready.js
          node --check assets/character-knight.js
          node --test tests/character-knight.test.js
          node --test tests/character-ready.test.js
          node --test tests/character-trace.test.js
          node --test tests/character-flat.test.js
          node --test tests/character-static-trace.test.js
          node --test tests/character-art.test.js
      - name: Validate reference image and SVG layers
        shell: python
        run: |
          import json
          import struct
          from pathlib import Path
          from xml.etree import ElementTree as ET
          root = Path('assets/character-art/svg/hero')
          manifest = json.loads((root / 'manifest.json').read_text('utf-8'))
          assert manifest['id'] == 'hero'
          assert len(manifest['parts']) == 12
          for spec in manifest['parts']:
              doc = ET.parse(root / spec['file']).getroot()
              assert doc.tag == '{http://www.w3.org/2000/svg}svg'
              assert doc.attrib['width'] == '200' and doc.attrib['height'] == '165'
              assert doc.attrib['viewBox'] == '-100 -150 200 165'
          png = Path('assets/character-art/references/hero/approved.png').read_bytes()
          assert png.startswith(b'\x89PNG\r\n\x1a\n')
          width, height = struct.unpack('>II', png[16:24])
          assert 1 <= width <= 8192 and 1 <= height <= 8192
          print('Hero SVG layers and reference PNG valid')
      - name: Check dedicated enemies and developer launcher syntax
        run: |
          node --check assets/enemy-motions.js
          node --check assets/dev-tools.js
          node --test tests/enemy-motions.test.js
      - name: Check encounter data and gameplay invariants
        run: |
          node --check assets/encounters.js
          node --test tests/final-stage.test.js tests/deep-zones.test.js tests/diagnostics.test.js tests/encounters.test.js tests/progression.test.js tests/relics.test.js tests/routes.test.js tests/events.test.js tests/game-smoke.test.js
      - name: Reproduce permanent-upgrade boss balance simulation
        run: |
          node --check scripts/balance-simulation.js
          node --test tests/balance-simulation.test.js
          node scripts/balance-simulation.js
      - name: Check concise UI copy and preserve gameplay rules
        run: node --test tests/ui-copy.test.js
      - name: Check font license credit and display asset
        run: node --test tests/font-credits.test.js
      - name: Check Pages entry and asset links
        shell: python
        run: |
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          build = 'v0.9.3-2'
          paths = [
              'style.css', 'diagnostics.js', 'encounters.js', 'enemy-motions.js',
              'progression.js', 'relics.js', 'routes.js', 'events.js', 'character-art.js', 'character-svg.js', 'character-flat.js', 'character-trace.js', 'character-ready.js', 'character-knight.js', 'game.js'
          ]
          for page in ['index.html', 'dev.html']:
              text = Path(page).read_text(encoding='utf-8')
              assert f'<meta name="parry-build" content="{build}">' in text
              for asset in paths:
                  assert f'./assets/{asset}?v={build}' in text, (page, asset)
                  assert Path('assets', asset).is_file()
              assert text.index('assets/diagnostics.js') < text.index('assets/game.js')
          assert 'dev.html' not in html
          dev = Path('dev.html').read_text(encoding='utf-8')
          assert 'data-parry-dev="true"' in dev
          assert f'./assets/dev-tools.js?v={build}' in dev
          assert f'./assets/dev-tools.css?v={build}' in dev
          assert Path('assets/dev-tools.js').is_file()
          assert Path('assets/dev-tools.css').is_file()
          print('Static Pages layout OK')
