<path d="M1-41 16-38 22-6 7-5Z" fill="#6b859e" stroke="#1b304a" stroke-width="3"/>
<path d="M-21-11-3-11-2 2-24 2Z M6-11 23-11 28 2 4 2Z" fill="#263b53" stroke="#0c1c31" stroke-width="3"/>
