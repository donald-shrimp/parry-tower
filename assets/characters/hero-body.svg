<path d="M-6-118 1-132 11-119 8-112Z" fill="#d5e3e9" stroke="#28435d" stroke-width="2"/>
<path d="M-18-105-22-111-28-108-21-95 M18-105 26-111 29-104 21-92" fill="#48677d" stroke="#1a3048" stroke-width="2"/>
<path d="M-17-100 15-101 13-90-17-90Z" fill="#1c2d42" stroke="#0b1a2b" stroke-width="2"/>
<path d="M-13-97 11-98" stroke="#9df5ef" stroke-width="3.3"/>
<path d="M-3-89 7-90 4-83-2-83Z" fill="url(#gold)"/>
<path d="M-14-107-5-115 M10-113 15-105" stroke="#f5fbf4" stroke-width="1.6" opacity=".9"/>
