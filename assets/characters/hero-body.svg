<path d="M-21-83-3-90 18-83 26-47 17-32-16-34-26-48Z" fill="#1e314b" stroke="#09192b" stroke-width="3"/>
<path d="M-20-82-9-88 4-85 7-46-12-40-25-51Z" fill="url(#breast)" stroke="#263d57" stroke-width="2"/>
