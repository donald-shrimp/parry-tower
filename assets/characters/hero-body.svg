<svg xmlns="http://www.w3.org/2000/svg" width="120" height="140" viewBox="-60 -136 120 140">
<title>塔を登る蒼鋼の騎士（試作胴体）</title>
<defs>
 <linearGradient id="cape" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#30768b"/><stop offset=".55" stop-color="#1d3b5b"/><stop offset="1" stop-color="#12243e"/></linearGradient>
 <linearGradient id="steel" x1="0" y1="0" x2="1" y2=".8"><stop stop-color="#e5eef2"/><stop offset=".32" stop-color="#8eaac0"/><stop offset="1" stop-color="#4b6079"/></linearGradient>
 <linearGradient id="breast" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c0d6e0"/><stop offset=".38" stop-color="#587993"/><stop offset="1" stop-color="#283f59"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffdfac"/><stop offset="1" stop-color="#a77a50"/></linearGradient>
</defs>
<g stroke-linejoin="round" stroke-linecap="round">
<!-- Split cloak with distinct outer silhouette; animation stays in Canvas. -->
<path d="M-15-83 Q-31-79-42-62 L-54-12-43-20-39-5-28-15-21-7-8-39Z" fill="url(#cape)" stroke="#0e253c" stroke-width="3"/>
