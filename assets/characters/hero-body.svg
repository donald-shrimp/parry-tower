<path d="M-20-79-29-71-25-56-12-63Z" fill="url(#steel)" stroke="#1c324a" stroke-width="2.4"/>
<path d="M7-83 23-81 30-67 20-60 9-66Z" fill="url(#steel)" stroke="#203b55" stroke-width="2.4"/>
<path d="M-13-72-7-48-15-46 M16-73 19-53" fill="none" stroke="#d2e1e7" stroke-width="1.5" opacity=".8"/>
