<svg xmlns="http://www.w3.org/2000/svg" width="120" height="144" viewBox="-60 -140 120 144">
<title>鉄壁の番兵（試作胴体）</title>
<defs>
 <linearGradient id="armor" x1=".12" y1="0" x2=".93" y2="1"><stop stop-color="#d7e1e0"/><stop offset=".3" stop-color="#819bad"/><stop offset=".75" stop-color="#496479"/><stop offset="1" stop-color="#354658"/></linearGradient>
