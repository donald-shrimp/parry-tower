<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>トレース版主人公・動作確認 | パリィの塔</title>
<style>
body{font:15px system-ui;background:#111a2d;color:#fff;max-width:840px;margin:24px auto;padding:0 12px}
canvas{display:block;background:#162337;max-width:100%;border-radius:12px;border:1px solid #576882}
button{padding:10px 18px;margin:0 8px 8px 0;background:#243b66;color:#fff;border:1px solid #829ac7;border-radius:6px;cursor:pointer}
.hint{color:#c0cce0}
</style></head>
<body>
<h2>主人公：静止SVGから切り出した剣・盾を動かす</h2>
<p>ゲームと同じ主人公ローカル座標で待機・ガード・反撃を描く補助プレビュー。実際のゲームは <code>dev.html?floor=2&amp;enemy=knight&amp;art=trace</code> で確認。</p>
<div><button data-p="idle">待機</button><button data-p="guard">ガード</button><button data-p="slash">反撃</button><button data-p="parry">ジャスト</button></div>
<p class="hint">敵は位置合わせのための図形。こちらのページは戦闘判定やWeb Audioを動かしません。</p>
<canvas id="stage" width="760" height="360"></canvas>
<script src="../../../../assets/character-trace.js"></script>
<script>
'use strict';
const canvas=document.getElementById('stage'),ctx=canvas.getContext('2d');
let pose='idle',started=performance.now();
for(const button of document.querySelectorAll('button')){
 button.addEventListener('click',()=>{pose=button.dataset.p;started=performance.now()});
}
const clamp=x=>Math.min(1,Math.max(0,x));
window.ParryHeroTrace.preload();
function loop(now){
 const {width:w,height:h}=canvas;
 ctx.clearRect(0,0,w,h);ctx.fillStyle='#172137';ctx.fillRect(0,0,w,h);
 ctx.fillStyle='#30364a';ctx.fillRect(0,h*.8,w,h*.2);
 ctx.fillStyle='#9c99aa';ctx.fillRect(0,h*.8,w,3);
 ctx.save();ctx.translate(w*.28,h*.8+Math.sin(now/390)*1.6);ctx.scale(1.17,1.17);
 const t=(now-started)/1000;
 const lift=(pose==='guard'||pose==='parry')?clamp(t/.13):0;
 const action=pose==='slash'?Math.sin(Math.PI*clamp(t/.3)):0;
 window.ParryHeroTrace.drawHero(ctx,{now,lift,action,guardHeld:pose==='guard',
  lastStrikeKind:pose==='parry'?'just':'',lastImpactAt:pose==='parry'?started:-99999,push:0});
 ctx.restore();
 ctx.fillStyle='#626f86';ctx.fillRect(w*.69,h*.8-110,42,110);
 ctx.fillStyle='#b4a99a';ctx.fillRect(w*.67,h*.8-125,75,20);
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script></body></html>
