<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>主人公・元PNGと静止SVGの比較 | パリィの塔 Draft PR #28</title>
<style>
:root{color-scheme:dark;font:16px/1.55 system-ui,sans-serif;background:#101827;color:#e6eaf4}
body{max-width:1024px;margin:24px auto;padding:0 16px}
h1{font-size:1.6rem;margin:0 0 10px}p{color:#bdc9e2}
fieldset{display:flex;gap:20px;flex-wrap:wrap;align-items:center;border:1px solid #51607d;border-radius:10px;padding:14px;margin:14px 0}
input[type=file]{max-width:100%}input[type=range]{width:160px}
strong{font-variant-numeric:tabular-nums}
canvas{display:block}
.preview{width:100%;max-width:628px;aspect-ratio:1;background:repeating-conic-gradient(#e9e9e9 0 25%,#fff 0 50%) 0 0/22px 22px;border:1px solid #6d7890;border-radius:12px;position:relative;overflow:hidden}
.preview img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;user-select:none;pointer-events:none}
#reference{opacity:.5}
.sizes{display:flex;gap:24px;flex-wrap:wrap;margin:22px 0}
.sizes figure{margin:0}.sizes img{background:#fff;border:1px solid #808899}
.notice{border-left:3px solid #ffce5e;padding:8px 14px;background:#262536;max-width:700px}
</style>
</head>
<body>
<h1>主人公：PNG / 静止SVG 比較</h1>
<p>Draft PR #28・工程4。まず元PNG（<code>a_clean_minimalist_vector_flat_cartoon_illustratio.png</code>）を選択。<b>選択した画像はブラウザ内だけで表示し、アップロードしない</b>。</p>
<fieldset>
<label>元のPNGを選ぶ <input id="file" type="file" accept="image/png,image/*"></label>
<label>元PNGの重ね合わせ率 <input id="blend" type="range" min="0" max="100" value="50"><strong id="blendValue">50%</strong></label>
</fieldset>
<div class="preview">
<img src="./hero-static.svg" alt="今回作ったトレース済み静止SVG">
<img id="reference" alt="ユーザーが選択した元PNG（SVG上に重ね表示）">
</div>
<div class="sizes">
<figure><img width="96" height="96" src="./hero-static.svg" alt="96pxのSVG"><figcaption>96px表示</figcaption></figure>
<figure><img width="128" height="128" src="./hero-static.svg" alt="128pxのSVG"><figcaption>128px表示</figcaption></figure>
</div>
<p class="notice">承認前の静止画検証用。盾の外形・剣先・兜・マントの輪郭と配色、白い隙間を確認してね。<b>SVGの可動パーツ分割やゲーム組み込みはまだしていない。</b></p>
<script>
'use strict';
const file=document.getElementById('file'),ref=document.getElementById('reference');
const slider=document.getElementById('blend'),label=document.getElementById('blendValue');
let url=null;
file.addEventListener('change',()=>{
 if(url)URL.revokeObjectURL(url);
 const selected=file.files?.[0];
 url=selected?URL.createObjectURL(selected):null;
 ref.src=url||'';
});
slider.addEventListener('input',()=>{
 label.textContent=slider.value+'%';
 ref.style.opacity=String(Number(slider.value)/100);
});
</script>
</body></html>
